name: bm_flutter_networking
description: "Type-safe Flutter networking layer: one class per endpoint, automatic token refresh with retry, hybrid AES/RSA payload encryption, timeouts and cancellation, drop-on-disconnect handling, self-healing WebSocket streams, SSL pinning and an in-app network inspector."
version: 2.2.0
homepage: "https://github.com/BakrIOS91/BMFlutterNetworking"

platforms:
  android:
  ios:
  macos:
  windows:
  linux:
  web:

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & Connectivity
  http: ^1.6.0
  http_parser: ^4.1.2
  connectivity_plus: ^7.1.1
  sensors_plus: ^6.0.0
  web_socket_channel: ^3.0.3

  # Security & Cryptography
  pointycastle: ^4.0.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  stream_channel: ^2.1.4

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: ShakeDetectorPlugin
